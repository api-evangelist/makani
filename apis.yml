name: Makani *
description: 'Makani was an Alphabet (Google X) moonshot developing airborne wind energy
  — "energy kites" that flew in crosswind loops to generate electricity and sent power
  to the grid down a tether. Backed within Alphabet and partnered with Shell, Makani
  wound down in 2020 after roughly 13 years of development. On closure the team open-sourced
  its full flight-simulation, autopilot controller, visualization, and avionics software
  stack under Apache-2.0 and published the Energy Kite Collection of technical reports,
  designs, and flight logs. Makani has no commercial or developer API surface; this
  API Evangelist profile tracks the company for network completeness.'
